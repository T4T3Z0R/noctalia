name: Validate Noctalia custom source

on:
  workflow_dispatch:
  push:
    branches:
      - custom

permissions:
  contents: write

concurrency:
  group: noctalia-source-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-source:
    name: Format, build, test, and lint
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Install Arch build dependencies
        run: |
          set -euo pipefail

          pacman -Syu --noconfirm --needed \
            base-devel git meson ninja pkgconf \
            wayland wayland-protocols \
            libglvnd freetype2 fontconfig noto-fonts \
            cairo pango harfbuzz \
            libxkbcommon glib2 \
            libsecret libsodium \
            sdbus-cpp libpipewire wireplumber polkit \
            pam curl libwebp libjxl libsndfile librsvg \
            libqalculate libxml2 \
            md4c tomlplusplus libical \
            nlohmann-json stb \
            jemalloc just clang

      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create build user
        run: |
          set -euo pipefail

          useradd -m builduser
          chown -R builduser:builduser "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Format v5.5.0 candidate on GitHub
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/migration/v5.5.0-candidate" ]]; then
            exit 0
          fi

          clang-format --version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          clang-format -i lib/wayland/wayland_seat.cpp lib/wayland/wayland_seat.h src/shell/lockscreen/lock_surface.cpp src/shell/lockscreen/lock_surface.h src/shell/lockscreen/lockscreen_keyboard.cpp src/shell/lockscreen/lockscreen_keyboard.h src/shell/lockscreen/lockscreen_login_box.cpp src/shell/lockscreen/lockscreen_login_box.h tests/lockscreen_keyboard_test.cpp

          git diff --check
          git add lib/wayland/wayland_seat.cpp lib/wayland/wayland_seat.h src/shell/lockscreen/lock_surface.cpp src/shell/lockscreen/lock_surface.h src/shell/lockscreen/lockscreen_keyboard.cpp src/shell/lockscreen/lockscreen_keyboard.h src/shell/lockscreen/lockscreen_login_box.cpp src/shell/lockscreen/lockscreen_login_box.h tests/lockscreen_keyboard_test.cpp

          if git diff --cached --quiet; then
            echo "Formatting already clean."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(input): format tablet-v2 port with clang 23"
          git push origin HEAD:refs/heads/migration/v5.5.0-candidate

      - name: Check formatting
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            find src lib tests \( -name '*.cpp' -o -name '*.h' \) -print0
          )

          clang-format --dry-run -Werror "${files[@]}"

      - name: Build, test, and lint source
        run: |
          set -euo pipefail

          su builduser -c "cd '$GITHUB_WORKSPACE' && just build"
          su builduser -c "cd '$GITHUB_WORKSPACE' && just test debug --print-errorlogs"
          su builduser -c "cd '$GITHUB_WORKSPACE' && just lint"

      - name: Validation summary
        run: |
          {
            echo '## Noctalia custom source validation'
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo '- Arch Linux validation environment'
            echo '- Formatting: **PASSED**'
            echo '- Build: **PASSED**'
            echo '- Tests: **PASSED**'
            echo '- Lint: **PASSED**'
            echo
            echo 'Packaging, license validation, signing, and publication are handled by T4T3Z0R/packages.'
          } >> "$GITHUB_STEP_SUMMARY"
