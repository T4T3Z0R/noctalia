name: Update custom branch

on:
  workflow_dispatch:
    inputs:
      test_pushover:
        description: Send a Pushover test notification
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '37 9 * * *'
      timezone: "America/New_York"

permissions:
  contents: read

concurrency:
  group: update-custom
  cancel-in-progress: false

env:
  UPSTREAM_REPO: noctalia-dev/noctalia
  CUSTOM_BRANCH: custom
  CANDIDATE_BRANCH: automation/custom-candidate
  TABLET_MARKER_BRANCH: automation/upstream-tablet-detected
  BUILD_WORKFLOW: build-arch-package.yml

jobs:
  check:
    name: Check upstream release
    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.check.outputs.changed }}
      current_tag: ${{ steps.check.outputs.current_tag }}
      latest_tag: ${{ steps.check.outputs.latest_tag }}
      custom_sha: ${{ steps.check.outputs.custom_sha }}
      upstream_support: ${{ steps.check.outputs.upstream_support }}
      support_already_reported: ${{ steps.check.outputs.support_already_reported }}

    steps:
      - name: Checkout control branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compare releases
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git remote add upstream \
            "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null \
            || git remote set-url upstream \
              "https://github.com/${UPSTREAM_REPO}.git"

          git fetch origin \
            "${CUSTOM_BRANCH}:refs/remotes/origin/${CUSTOM_BRANCH}"

          git fetch --force upstream \
            'refs/tags/*:refs/tags/*'

          latest_tag="$(
            gh api "repos/${UPSTREAM_REPO}/releases/latest" \
              --jq '.tag_name'
          )"

          current_tag="$(
            git describe \
              --tags \
              --abbrev=0 \
              "origin/${CUSTOM_BRANCH}"
          )"

          custom_sha="$(
            git rev-parse "origin/${CUSTOM_BRANCH}"
          )"

          latest_sha="$(
            git rev-list -n 1 "${latest_tag}"
          )"

          changed=false
          upstream_support=false
          support_already_reported=false

          if [[ "${latest_tag}" != "${current_tag}" ]]; then
            changed=true

            if git grep -Eq \
              'zwp_tablet_(manager|seat)_v2|tablet-unstable-v2' \
              "${latest_tag}" \
              -- meson.build src/wayland 2>/dev/null
            then
              upstream_support=true

              git fetch origin \
                "${TABLET_MARKER_BRANCH}:refs/remotes/origin/${TABLET_MARKER_BRANCH}" \
                2>/dev/null || true

              if git rev-parse \
                   "origin/${TABLET_MARKER_BRANCH}" \
                   >/dev/null 2>&1
              then
                marker_sha="$(
                  git rev-parse \
                    "origin/${TABLET_MARKER_BRANCH}"
                )"

                if [[ "${marker_sha}" == "${latest_sha}" ]]; then
                  support_already_reported=true
                fi
              fi
            fi
          fi

          {
            echo "changed=${changed}"
            echo "current_tag=${current_tag}"
            echo "latest_tag=${latest_tag}"
            echo "custom_sha=${custom_sha}"
            echo "upstream_support=${upstream_support}"
            echo "support_already_reported=${support_already_reported}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo '## Noctalia custom updater'
            echo
            echo "- Current custom base: \`${current_tag}\`"
            echo "- Latest upstream: \`${latest_tag}\`"
            echo "- Update needed: \`${changed}\`"
            echo "- Upstream tablet-v2 detected: \`${upstream_support}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  upstream-support:
    name: Upstream tablet support detected
    needs: check

    if: >-
      needs.check.outputs.changed == 'true' &&
      needs.check.outputs.upstream_support == 'true' &&
      needs.check.outputs.support_already_reported != 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.CUSTOM_BRANCH_TOKEN }}

      - name: Record detected upstream release
        run: |
          set -euo pipefail

          git remote add upstream \
            "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null \
            || git remote set-url upstream \
              "https://github.com/${UPSTREAM_REPO}.git"

          git fetch --force upstream \
            "refs/tags/${{ needs.check.outputs.latest_tag }}:refs/tags/${{ needs.check.outputs.latest_tag }}"

          latest_sha="$(
            git rev-list -n 1 \
              "${{ needs.check.outputs.latest_tag }}"
          )"

          git push --force origin \
            "${latest_sha}:refs/heads/${TABLET_MARKER_BRANCH}"

      - name: Stop for manual review
        run: |
          echo "::error::Upstream ${{ needs.check.outputs.latest_tag }} appears to contain tablet-v2 support. The custom pen patch may no longer be needed."
          exit 1

  prepare:
    name: Rebase candidate
    needs: check

    if: >-
      needs.check.outputs.changed == 'true' &&
      needs.check.outputs.upstream_support != 'true'

    runs-on: ubuntu-latest

    outputs:
      candidate_sha: ${{ steps.rebase.outputs.candidate_sha }}

    steps:
      - name: Checkout custom branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CUSTOM_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.CUSTOM_BRANCH_TOKEN }}

      - name: Rebase onto new release
        id: rebase
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream \
            "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null \
            || git remote set-url upstream \
              "https://github.com/${UPSTREAM_REPO}.git"

          git fetch --force upstream \
            'refs/tags/*:refs/tags/*'

          git rebase \
            --onto "${{ needs.check.outputs.latest_tag }}" \
            "${{ needs.check.outputs.current_tag }}"

          candidate_sha="$(
            git rev-parse HEAD
          )"

          echo "candidate_sha=${candidate_sha}" \
            >> "${GITHUB_OUTPUT}"

          git push --force origin \
            "HEAD:refs/heads/${CANDIDATE_BRANCH}"

          {
            echo '## Candidate prepared'
            echo
            echo "- Old base: \`${{ needs.check.outputs.current_tag }}\`"
            echo "- New base: \`${{ needs.check.outputs.latest_tag }}\`"
            echo "- Candidate: \`${candidate_sha}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  validate:
    name: Validate candidate package
    needs:
      - check
      - prepare

    permissions:
      contents: read
      actions: write

    runs-on: ubuntu-latest

    outputs:
      build_run_id: ${{ steps.validate.outputs.build_run_id }}

    steps:
      - name: Dispatch package workflow and wait
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          response="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${BUILD_WORKFLOW}/dispatches" \
              --data "$(jq -n \
                --arg ref "${CANDIDATE_BRANCH}" \
                '{ref: $ref}')"
          )"

          build_run_id="$(
            jq -r '.workflow_run_id // empty' \
              <<< "${response}"
          )"

          if [[ -z "${build_run_id}" ]]; then
            echo "Workflow dispatch did not return a run ID."
            echo "${response}"
            exit 1
          fi

          echo "build_run_id=${build_run_id}" \
            >> "${GITHUB_OUTPUT}"

          echo "Dispatched package run ${build_run_id}"

          while true; do
            run_json="$(
              curl --fail --silent --show-error \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "X-GitHub-Api-Version: 2026-03-10" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${build_run_id}"
            )"

            status="$(
              jq -r '.status' \
                <<< "${run_json}"
            )"

            conclusion="$(
              jq -r '.conclusion // ""' \
                <<< "${run_json}"
            )"

            echo "Package workflow: ${status}${conclusion:+ / ${conclusion}}"

            if [[ "${status}" == "completed" ]]; then
              break
            fi

            sleep 20
          done

          html_url="$(
            jq -r '.html_url' \
              <<< "${run_json}"
          )"

          {
            echo '## Candidate validation'
            echo
            echo "- Package workflow: ${html_url}"
            echo "- Result: \`${conclusion}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${conclusion}" != "success" ]]; then
            exit 1
          fi

  promote:
    name: Promote validated candidate
    needs:
      - check
      - prepare
      - validate

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.CUSTOM_BRANCH_TOKEN }}

      - name: Update custom branch
        run: |
          set -euo pipefail

          git fetch origin \
            "${CUSTOM_BRANCH}:refs/remotes/origin/${CUSTOM_BRANCH}" \
            "${CANDIDATE_BRANCH}:refs/remotes/origin/${CANDIDATE_BRANCH}"

          actual_custom_sha="$(
            git rev-parse \
              "origin/${CUSTOM_BRANCH}"
          )"

          expected_custom_sha="${{ needs.check.outputs.custom_sha }}"
          candidate_sha="${{ needs.prepare.outputs.candidate_sha }}"

          if [[ "${actual_custom_sha}" != "${expected_custom_sha}" ]]; then
            echo "custom moved while the candidate was building."
            echo "Expected: ${expected_custom_sha}"
            echo "Actual:   ${actual_custom_sha}"
            echo "Refusing to overwrite it."
            exit 1
          fi

          git push origin \
            "${candidate_sha}:refs/heads/${CUSTOM_BRANCH}" \
            --force-with-lease="refs/heads/${CUSTOM_BRANCH}:${expected_custom_sha}"

          {
            echo '## Custom branch updated'
            echo
            echo "- Release: \`${{ needs.check.outputs.latest_tag }}\`"
            echo "- Commit: \`${candidate_sha}\`"
            echo "- Package workflow run: \`${{ needs.validate.outputs.build_run_id }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  package_publish:
    name: Dispatch central package publisher
    needs:
      - prepare
      - promote

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Dispatch exact promoted commit
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
          SOURCE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::PACKAGES_DISPATCH_TOKEN is missing."
            exit 1
          fi

          gh workflow run publish-noctalia-custom.yml --repo T4T3Z0R/packages --ref main -f source_ref="${SOURCE_SHA}"

          {
            echo '## Package publication dispatched'
            echo
            echo "- Source commit: \`${SOURCE_SHA}\`"
            echo "- Publisher: \`T4T3Z0R/packages\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  cleanup:
    name: Remove candidate branch
    needs:
      - prepare
      - validate
      - promote

    if: always() && needs.prepare.result == 'success'

    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Delete temporary candidate
        run: |
          git push origin \
            --delete "${CANDIDATE_BRANCH}" \
            2>/dev/null || true

  notify:
    name: Notify via Pushover
    needs:
      - check
      - upstream-support
      - prepare
      - validate
      - promote
      - package_publish
      - cleanup

    if: >-
      always() &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.test_pushover == true) ||
        needs.check.result == 'failure' ||
        (
          needs.check.result == 'success' &&
          needs.check.outputs.changed == 'true' &&
          needs.check.outputs.upstream_support == 'true' &&
          needs.check.outputs.support_already_reported != 'true'
        ) ||
        needs.prepare.result == 'failure' ||
        needs.validate.result == 'failure' ||
        needs.promote.result == 'failure' ||
        needs.package_publish.result == 'failure'
      )

    runs-on: ubuntu-latest

    steps:
      - name: Send Pushover notification
        env:
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          TEST_PUSHOVER: ${{ inputs.test_pushover }}
          CHECK_RESULT: ${{ needs.check.result }}
          CURRENT_TAG: ${{ needs.check.outputs.current_tag }}
          LATEST_TAG: ${{ needs.check.outputs.latest_tag }}
          UPSTREAM_SUPPORT: ${{ needs.check.outputs.upstream_support }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PROMOTE_RESULT: ${{ needs.promote.result }}
          PACKAGE_PUBLISH_RESULT: ${{ needs.package_publish.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [[ -z "${PUSHOVER_APP_TOKEN}" || -z "${PUSHOVER_USER_KEY}" ]]; then
            echo "::error::Pushover secrets are missing."
            exit 1
          fi

          title="Noctalia custom"
          message="The updater completed with an unexpected state."

          if [[ "${TEST_PUSHOVER}" == "true" ]]; then
            title="Noctalia updater test"
            message="Pushover notifications from GitHub Actions are working."
          elif [[ "${CHECK_RESULT}" != "success" ]]; then
            title="Noctalia update check FAILED"
            message="The upstream release check failed before an update decision could be made."
          elif [[ "${UPSTREAM_SUPPORT}" == "true" ]]; then
            title="Noctalia upstream tablet support"
            message="Upstream ${LATEST_TAG} appears to contain tablet-v2 support. The custom pen patch was left unchanged and needs manual review."
          elif [[ "${PREPARE_RESULT}" == "failure" ]]; then
            title="Noctalia custom update FAILED"
            message="Rebase onto ${LATEST_TAG} failed. The existing custom branch remains unchanged."
          elif [[ "${VALIDATE_RESULT}" == "failure" ]]; then
            title="Noctalia custom update FAILED"
            message="Build, test, lint, or package validation for ${LATEST_TAG} failed. The existing custom branch remains unchanged."
          elif [[ "${PROMOTE_RESULT}" == "failure" ]]; then
            title="Noctalia custom update FAILED"
            message="Validation passed for ${LATEST_TAG}, but promotion of custom failed. Manual review is required."
          elif [[ "${PACKAGE_PUBLISH_RESULT}" == "failure" ]]; then
            title="Noctalia package dispatch FAILED"
            message="Custom was promoted to ${LATEST_TAG}, but dispatch to the central package publisher failed. The signed repository was not updated."
          fi

          curl --fail --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --max-time 30 \
            --form-string "token=${PUSHOVER_APP_TOKEN}" \
            --form-string "user=${PUSHOVER_USER_KEY}" \
            --form-string "title=${title}" \
            --form-string "message=${message}" \
            --form-string "url=${RUN_URL}" \
            --form-string "url_title=Open GitHub Actions run" \
            https://api.pushover.net/1/messages.json
