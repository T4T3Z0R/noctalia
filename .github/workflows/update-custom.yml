name: Update custom branch

on:
  workflow_dispatch:
    inputs:
      test_custom_token:
        description: Test custom branch credential without updating source
        required: false
        default: false
        type: boolean
      test_pushover:
        description: Send a Pushover test notification
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '37 9 * * *'
      timezone: "America/New_York"

permissions:
  contents: read

concurrency:
  group: update-custom
  cancel-in-progress: false

env:
  UPSTREAM_REPO: noctalia-dev/noctalia
  CUSTOM_BRANCH: custom
  CANDIDATE_BRANCH: automation/custom-candidate
  TABLET_MARKER_BRANCH: automation/upstream-tablet-detected
  BUILD_WORKFLOW: build-arch-package.yml

jobs:
  test-custom-token:
    name: Test custom branch credential
    if: ${{ github.repository == 'T4T3Z0R/noctalia' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' && inputs.test_custom_token) }}
    runs-on: ubuntu-latest

    steps:
      - name: Require retained credential
        env:
          CUSTOM_TOKEN: ${{ secrets.CUSTOM_BRANCH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$CUSTOM_TOKEN" ]]; then
            echo "::error::CUSTOM_BRANCH_TOKEN is missing."
            exit 1
          fi

      - name: Checkout trusted control revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify temporary branch creation and deletion
        shell: bash
        env:
          CUSTOM_GIT_TOKEN: ${{ secrets.CUSTOM_BRANCH_TOKEN }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source "$GITHUB_WORKSPACE/.github/scripts/authenticated-git.sh"


          test "$GITHUB_REPOSITORY" = T4T3Z0R/noctalia

          ref="refs/heads/automation/token-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git fetch --no-tags origin "refs/heads/custom"
          sha="$(git rev-parse --verify "FETCH_HEAD^{commit}")"

          test -z "$(git ls-remote --heads origin "$ref")"

          cleanup_probe() {
            authenticated_git push origin --delete "$ref" \
              --force-with-lease="$ref:$sha"
          }

          authenticated_git push origin "$sha:$ref" \
            --force-with-lease="$ref:"

          trap cleanup_probe EXIT

          test "$(git ls-remote --heads origin "$ref" |
            cut -f1)" = "$sha"

          echo 'PASS: Retained credential created temporary branch.'

          cleanup_probe
          trap - EXIT

          test -z "$(git ls-remote --heads origin "$ref")"

          echo 'PASS: Retained credential deleted temporary branch.'
          echo 'PASS: CUSTOM_BRANCH_TOKEN write access verified.'

  check:
    if: ${{ github.repository == 'T4T3Z0R/noctalia' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || !inputs.test_custom_token) }}
    name: Check upstream release
    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.check.outputs.changed }}
      current_tag: ${{ steps.check.outputs.current_tag }}
      current_base_sha: ${{ steps.check.outputs.current_base_sha }}
      latest_tag: ${{ steps.check.outputs.latest_tag }}
      latest_sha: ${{ steps.check.outputs.latest_sha }}
      custom_sha: ${{ steps.check.outputs.custom_sha }}
      upstream_support: ${{ steps.check.outputs.upstream_support }}
      support_already_reported: ${{ steps.check.outputs.support_already_reported }}

    steps:
      - name: Checkout control branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Compare releases
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git remote add upstream \
            "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null \
            || git remote set-url upstream \
              "https://github.com/${UPSTREAM_REPO}.git"

          git fetch origin \
            "${CUSTOM_BRANCH}:refs/remotes/origin/${CUSTOM_BRANCH}"

          git fetch --force upstream \
            'refs/tags/*:refs/tags/*'

          latest_tag="$(
            gh api "repos/${UPSTREAM_REPO}/releases/latest" \
              --jq '.tag_name'
          )"

          [[ "$latest_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git check-ref-format "refs/tags/$latest_tag"

          current_tag="$(
            git describe \
              --tags \
              --abbrev=0 \
              "origin/${CUSTOM_BRANCH}"
          )"

          [[ "$current_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git check-ref-format "refs/tags/$current_tag"

          current_base_sha="$(
            git rev-parse --verify "refs/tags/${current_tag}^{commit}"
          )"

          custom_sha="$(
            git rev-parse "origin/${CUSTOM_BRANCH}"
          )"

          latest_sha="$(
            git rev-parse --verify "refs/tags/${latest_tag}^{commit}"
          )"

          changed=false
          upstream_support=false
          support_already_reported=false

          if [[ "${latest_tag}" != "${current_tag}" ]]; then
            changed=true

            if git grep -Eq \
              'zwp_tablet_(manager|seat)_v2|tablet-unstable-v2' \
              "${latest_tag}" \
              -- meson.build src/wayland lib/wayland 2>/dev/null
            then
              upstream_support=true

              git fetch origin \
                "${TABLET_MARKER_BRANCH}:refs/remotes/origin/${TABLET_MARKER_BRANCH}" \
                2>/dev/null || true

              if git rev-parse \
                   "origin/${TABLET_MARKER_BRANCH}" \
                   >/dev/null 2>&1
              then
                marker_sha="$(
                  git rev-parse \
                    "origin/${TABLET_MARKER_BRANCH}"
                )"

                if [[ "${marker_sha}" == "${latest_sha}" ]]; then
                  support_already_reported=true
                fi
              fi
            fi
          fi

          {
            echo "changed=${changed}"
            echo "current_tag=${current_tag}"
            echo "current_base_sha=${current_base_sha}"
            echo "latest_tag=${latest_tag}"
            echo "latest_sha=${latest_sha}"
            echo "custom_sha=${custom_sha}"
            echo "upstream_support=${upstream_support}"
            echo "support_already_reported=${support_already_reported}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo '## Noctalia custom updater'
            echo
            echo "- Current custom base: \`${current_tag}\`"
            echo "- Latest upstream: \`${latest_tag}\`"
            echo "- Update needed: \`${changed}\`"
            echo "- Upstream tablet-v2 detected: \`${upstream_support}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  upstream-support:
    name: Upstream patch review needed
    needs: check

    if: >-
      github.repository == 'T4T3Z0R/noctalia' &&
      github.ref == 'refs/heads/main' &&
      needs.check.outputs.changed == 'true' &&
      needs.check.outputs.upstream_support == 'true' &&
      needs.check.outputs.support_already_reported != 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout trusted control revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve detected upstream release
        id: marker
        env:
          LATEST_TAG: ${{ needs.check.outputs.latest_tag }}
          EXPECTED_SHA: ${{ needs.check.outputs.latest_sha }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          [[ "$LATEST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]

          git check-ref-format "refs/tags/$LATEST_TAG"

          git fetch --no-tags \
            "https://github.com/${UPSTREAM_REPO}.git" \
            "refs/tags/${LATEST_TAG}"

          latest_sha="$(git rev-parse --verify "FETCH_HEAD^{commit}")"

          test "$latest_sha" = "$EXPECTED_SHA"

          printf 'sha=%s\n' "$latest_sha" >> "$GITHUB_OUTPUT"

      - name: Record exact upstream marker
        env:
          CUSTOM_GIT_TOKEN: ${{ secrets.CUSTOM_BRANCH_TOKEN }}
          MARKER_SHA: ${{ steps.marker.outputs.sha }}
          EXPECTED_SHA: ${{ needs.check.outputs.latest_sha }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source "$GITHUB_WORKSPACE/.github/scripts/authenticated-git.sh"

          [[ "$MARKER_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$MARKER_SHA" = "$EXPECTED_SHA"
          test "$TABLET_MARKER_BRANCH" = automation/upstream-tablet-detected

          test "$(git cat-file -t "$MARKER_SHA")" = commit

          authenticated_git push origin \
            --force "${MARKER_SHA}:refs/heads/${TABLET_MARKER_BRANCH}"

      - name: Stop for manual review
        env:
          LATEST_TAG: ${{ needs.check.outputs.latest_tag }}
        run: |
          set -euo pipefail

          [[ "$LATEST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

          printf '::error::Upstream %s appears to contain tablet-v2 support. The custom pen patch may no longer be needed.\n' \
            "$LATEST_TAG"

          exit 1

  rebase-candidate:
    name: Prepare credential-free candidate
    needs: check

    if: >-
      github.repository == 'T4T3Z0R/noctalia' &&
      github.ref == 'refs/heads/main' &&
      needs.check.outputs.changed == 'true' &&
      needs.check.outputs.upstream_support != 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    outputs:
      candidate_sha: ${{ steps.rebase.outputs.candidate_sha }}
      bundle_sha256: ${{ steps.rebase.outputs.bundle_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Checkout trusted control revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare exact candidate and export bundle
        id: rebase
        env:
          CUSTOM_SHA: ${{ needs.check.outputs.custom_sha }}
          CURRENT_BASE_SHA: ${{ needs.check.outputs.current_base_sha }}
          LATEST_SHA: ${{ needs.check.outputs.latest_sha }}
          LATEST_TAG: ${{ needs.check.outputs.latest_tag }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          for revision in "$CUSTOM_SHA" "$CURRENT_BASE_SHA" "$LATEST_SHA"
          do
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          done

          [[ "$LATEST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

          control="$GITHUB_WORKSPACE/.github/scripts"

          scratch="$(mktemp -d "$RUNNER_TEMP/candidate-preparation.XXXXXXXX")"

          trap 'rm -rf -- "$scratch"' EXIT

          mkdir -m 700 "$scratch/home" "$scratch/repository"

          export HOME="$scratch/home"
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_TERMINAL_PROMPT=0

          unset GIT_CONFIG_COUNT GIT_CONFIG_PARAMETERS
          unset GIT_TEMPLATE_DIR GIT_EXEC_PATH
          unset GIT_ASKPASS SSH_ASKPASS

          cd "$scratch/repository"

          git init --template= --initial-branch=workspace

          git -c fetch.fsckObjects=true fetch --no-tags \
            https://github.com/T4T3Z0R/noctalia.git \
            refs/heads/custom

          test "$(git rev-parse --verify "FETCH_HEAD^{commit}")" = "$CUSTOM_SHA"

          git -c fetch.fsckObjects=true fetch --no-tags \
            https://github.com/noctalia-dev/noctalia.git \
            "refs/tags/$LATEST_TAG"

          test "$(git rev-parse --verify "FETCH_HEAD^{commit}")" = "$LATEST_SHA"

          test "$(git cat-file -t "$CURRENT_BASE_SHA")" = commit

          candidate_sha="$(
            bash "$control/prepare-candidate.sh" \
              "$CUSTOM_SHA" "$CURRENT_BASE_SHA" "$LATEST_SHA"
          )"

          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]

          artifact_dir="$RUNNER_TEMP/candidate-transfer"

          mkdir -m 700 "$artifact_dir"

          bundle_sha256="$(
            bash "$control/candidate-bundle.sh" export \
              "$artifact_dir/candidate.bundle" \
              "$candidate_sha" "$LATEST_SHA" -
          )"

          [[ "$bundle_sha256" =~ ^[0-9a-f]{64}$ ]]

          {
            printf 'candidate_sha=%s\n' "$candidate_sha"
            printf 'bundle_sha256=%s\n' "$bundle_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Upload exact candidate bundle
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: noctalia-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-transfer/candidate.bundle
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  prepare:
    name: Publish prepared candidate
    needs:
      - check
      - rebase-candidate

    if: >-
      github.repository == 'T4T3Z0R/noctalia' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    outputs:
      candidate_sha: ${{ steps.publish.outputs.candidate_sha }}

    steps:
      - name: Checkout trusted control revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download exact candidate bundle
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.rebase-candidate.outputs.artifact_id }}
          path: ${{ runner.temp }}/candidate-transfer

      - name: Verify and import candidate objects
        id: receive
        env:
          CANDIDATE_SHA: ${{ needs.rebase-candidate.outputs.candidate_sha }}
          BUNDLE_SHA256: ${{ needs.rebase-candidate.outputs.bundle_sha256 }}
          LATEST_SHA: ${{ needs.check.outputs.latest_sha }}
          LATEST_TAG: ${{ needs.check.outputs.latest_tag }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$LATEST_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$LATEST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

          control="$GITHUB_WORKSPACE/.github/scripts"
          artifact_dir="$RUNNER_TEMP/candidate-transfer"

          test "$(find "$artifact_dir" -mindepth 1 -printf '%P\n')" = candidate.bundle

          scratch="$RUNNER_TEMP/candidate-receiver"

          mkdir -m 700 "$scratch"
          mkdir -m 700 "$scratch/home" "$scratch/repository"

          export HOME="$scratch/home"
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_TERMINAL_PROMPT=0

          unset GIT_CONFIG_COUNT GIT_CONFIG_PARAMETERS
          unset GIT_TEMPLATE_DIR GIT_EXEC_PATH
          unset GIT_ASKPASS SSH_ASKPASS

          cd "$scratch/repository"

          git init --bare --template=

          git -c fetch.fsckObjects=true fetch --no-tags \
            https://github.com/noctalia-dev/noctalia.git \
            "refs/tags/$LATEST_TAG"

          test "$(git rev-parse --verify "FETCH_HEAD^{commit}")" = "$LATEST_SHA"

          actual="$(
            bash "$control/candidate-bundle.sh" import \
              "$artifact_dir/candidate.bundle" \
              "$CANDIDATE_SHA" "$LATEST_SHA" "$BUNDLE_SHA256"
          )"

          test "$actual" = "$CANDIDATE_SHA"

          git remote add origin \
            https://github.com/T4T3Z0R/noctalia.git

          printf 'candidate_sha=%s\n' "$actual" >> "$GITHUB_OUTPUT"

      - name: Publish exact candidate reference
        id: publish
        env:
          CUSTOM_GIT_TOKEN: ${{ secrets.CUSTOM_BRANCH_TOKEN }}
          CANDIDATE_SHA: ${{ steps.receive.outputs.candidate_sha }}
          EXPECTED_SHA: ${{ needs.rebase-candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source "$GITHUB_WORKSPACE/.github/scripts/authenticated-git.sh"

          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$CANDIDATE_SHA" = "$EXPECTED_SHA"
          test "$CANDIDATE_BRANCH" = automation/custom-candidate

          scratch="$RUNNER_TEMP/candidate-receiver"

          export HOME="$scratch/home"
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_TERMINAL_PROMPT=0

          unset GIT_CONFIG_COUNT GIT_CONFIG_PARAMETERS
          unset GIT_TEMPLATE_DIR GIT_EXEC_PATH
          unset GIT_ASKPASS SSH_ASKPASS

          cd "$scratch/repository"

          test "$(git rev-parse --is-bare-repository)" = true

          actual="$(git rev-parse --verify "refs/heads/remediation-transfer^{commit}")"

          test "$actual" = "$CANDIDATE_SHA"

          authenticated_git push origin \
            --force "${CANDIDATE_SHA}:refs/heads/${CANDIDATE_BRANCH}"

          printf 'candidate_sha=%s\n' "$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate candidate source
    needs:
      - check
      - prepare

    permissions:
      contents: read
      actions: write

    runs-on: ubuntu-latest

    outputs:
      build_run_id: ${{ steps.validate.outputs.build_run_id }}

    steps:
      - name: Dispatch source validation workflow and wait
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          response="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${BUILD_WORKFLOW}/dispatches" \
              --data "$(jq -n \
                --arg ref "${CANDIDATE_BRANCH}" \
                '{ref: $ref}')"
          )"

          build_run_id="$(
            jq -r '.workflow_run_id // empty' \
              <<< "${response}"
          )"

          if [[ -z "${build_run_id}" ]]; then
            echo "Workflow dispatch did not return a run ID."
            echo "${response}"
            exit 1
          fi

          echo "build_run_id=${build_run_id}" \
            >> "${GITHUB_OUTPUT}"

          echo "Dispatched source validation run ${build_run_id}"

          while true; do
            run_json="$(
              curl --fail --silent --show-error \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "X-GitHub-Api-Version: 2026-03-10" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${build_run_id}"
            )"

            status="$(
              jq -r '.status' \
                <<< "${run_json}"
            )"

            conclusion="$(
              jq -r '.conclusion // ""' \
                <<< "${run_json}"
            )"

            echo "Source validation workflow: ${status}${conclusion:+ / ${conclusion}}"

            if [[ "${status}" == "completed" ]]; then
              break
            fi

            sleep 20
          done

          html_url="$(
            jq -r '.html_url' \
              <<< "${run_json}"
          )"

          {
            echo '## Candidate validation'
            echo
            echo "- Source validation workflow: ${html_url}"
            echo "- Result: \`${conclusion}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${conclusion}" != "success" ]]; then
            exit 1
          fi

  promote:
    if: ${{ github.repository == 'T4T3Z0R/noctalia' && github.ref == 'refs/heads/main' }}
    name: Promote validated candidate
    needs:
      - check
      - prepare
      - validate

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Update custom branch
        env:
          CUSTOM_GIT_TOKEN: ${{ secrets.CUSTOM_BRANCH_TOKEN }}
          EXPECTED_CUSTOM_SHA: ${{ needs.check.outputs.custom_sha }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          LATEST_TAG: ${{ needs.check.outputs.latest_tag }}
          BUILD_RUN_ID: ${{ needs.validate.outputs.build_run_id }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source "$GITHUB_WORKSPACE/.github/scripts/authenticated-git.sh"


          git fetch origin \
            "${CUSTOM_BRANCH}:refs/remotes/origin/${CUSTOM_BRANCH}" \
            "${CANDIDATE_BRANCH}:refs/remotes/origin/${CANDIDATE_BRANCH}"

          actual_custom_sha="$(
            git rev-parse \
              "origin/${CUSTOM_BRANCH}"
          )"

          expected_custom_sha="$EXPECTED_CUSTOM_SHA"
          candidate_sha="$CANDIDATE_SHA"

          [[ "$expected_custom_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]

          if [[ "${actual_custom_sha}" != "${expected_custom_sha}" ]]; then
            echo "custom moved while the candidate was building."
            echo "Expected: ${expected_custom_sha}"
            echo "Actual:   ${actual_custom_sha}"
            echo "Refusing to overwrite it."
            exit 1
          fi

          authenticated_git push origin \
            "${candidate_sha}:refs/heads/${CUSTOM_BRANCH}" \
            --force-with-lease="refs/heads/${CUSTOM_BRANCH}:${expected_custom_sha}"

          {
            echo '## Custom branch updated'
            echo
            echo "- Release: \`${LATEST_TAG}\`"
            echo "- Commit: \`${candidate_sha}\`"
            echo "- Source validation run: \`${BUILD_RUN_ID}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  cleanup:
    name: Remove candidate branch
    needs:
      - prepare
      - validate
      - promote

    if: ${{ github.repository == 'T4T3Z0R/noctalia' && github.ref == 'refs/heads/main' && (always() && needs.prepare.result == 'success') }}

    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Delete temporary candidate
        env:
          CUSTOM_GIT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source "$GITHUB_WORKSPACE/.github/scripts/authenticated-git.sh"


          authenticated_git push origin \
            --delete "${CANDIDATE_BRANCH}" \
            2>/dev/null || true

  notify:
    name: Notify via Pushover
    needs:
      - check
      - upstream-support
      - rebase-candidate
      - prepare
      - validate
      - promote
      - cleanup

    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || !inputs.test_custom_token) &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.test_pushover == true) ||
        needs.check.result == 'failure' ||
        (
          needs.check.result == 'success' &&
          needs.check.outputs.changed == 'true' &&
          needs.check.outputs.upstream_support == 'true' &&
          needs.check.outputs.support_already_reported != 'true'
        ) ||
        needs.rebase-candidate.result == 'failure' ||
        needs.prepare.result == 'failure' ||
        needs.validate.result == 'failure' ||
        needs.promote.result == 'failure'
      )

    runs-on: ubuntu-latest

    steps:
      - name: Send Pushover notification
        env:
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          TEST_PUSHOVER: ${{ inputs.test_pushover }}
          CHECK_RESULT: ${{ needs.check.result }}
          CURRENT_TAG: ${{ needs.check.outputs.current_tag }}
          LATEST_TAG: ${{ needs.check.outputs.latest_tag }}
          UPSTREAM_SUPPORT: ${{ needs.check.outputs.upstream_support }}
          REBASE_RESULT: ${{ needs.rebase-candidate.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PROMOTE_RESULT: ${{ needs.promote.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [[ -z "${PUSHOVER_APP_TOKEN}" || -z "${PUSHOVER_USER_KEY}" ]]; then
            echo "::error::Pushover secrets are missing."
            exit 1
          fi

          title="Noctalia custom"
          message="The updater completed with an unexpected state."

          if [[ "${TEST_PUSHOVER}" == "true" ]]; then
            title="Noctalia updater test"
            message="Pushover notifications from GitHub Actions are working."
          elif [[ "${CHECK_RESULT}" != "success" ]]; then
            title="Noctalia update check FAILED"
            message="The upstream release check failed before an update decision could be made."
          elif [[ "${UPSTREAM_SUPPORT}" == "true" ]]; then
            title="Noctalia upstream tablet support"
            message="Upstream ${LATEST_TAG} appears to contain tablet-v2 support. The custom pen patch was left unchanged and needs manual review."
          elif [[ "${REBASE_RESULT}" == "failure" || "${PREPARE_RESULT}" == "failure" ]]; then
            title="Noctalia custom update FAILED"
            message="Rebase onto ${LATEST_TAG} failed. The existing custom branch remains unchanged."
          elif [[ "${VALIDATE_RESULT}" == "failure" ]]; then
            title="Noctalia custom update FAILED"
            message="Source validation (formatting, build, tests, or lint) for ${LATEST_TAG} failed. The existing custom branch remains unchanged."
          elif [[ "${PROMOTE_RESULT}" == "failure" ]]; then
            title="Noctalia custom update FAILED"
            message="Validation passed for ${LATEST_TAG}, but promotion of custom failed. Manual review is required."
          fi

          curl --fail --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --max-time 30 \
            --form-string "token=${PUSHOVER_APP_TOKEN}" \
            --form-string "user=${PUSHOVER_USER_KEY}" \
            --form-string "title=${title}" \
            --form-string "message=${message}" \
            --form-string "url=${RUN_URL}" \
            --form-string "url_title=Open GitHub Actions run" \
            https://api.pushover.net/1/messages.json
