name: Update custom branch

on:
  workflow_dispatch:
    inputs:
      test_pushover:
        description: Send a Pushover test notification
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '37 9 * * *'
      timezone: "America/New_York"

permissions:
  contents: read

concurrency:
  group: update-custom
  cancel-in-progress: false

env:
  UPSTREAM_REPO: noctalia-dev/noctalia
  CUSTOM_BRANCH: custom
  TABLET_MARKER_BRANCH: automation/upstream-tablet-detected

jobs:
  check:
    permissions:
      contents: read
    if: ${{ github.repository == 'T4T3Z0R/noctalia' && github.ref == 'refs/heads/main' }}
    name: Check upstream release
    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.check.outputs.changed }}
      current_tag: ${{ steps.check.outputs.current_tag }}
      current_base_sha: ${{ steps.check.outputs.current_base_sha }}
      latest_tag: ${{ steps.check.outputs.latest_tag }}
      latest_sha: ${{ steps.check.outputs.latest_sha }}
      custom_sha: ${{ steps.check.outputs.custom_sha }}
      upstream_support: ${{ steps.check.outputs.upstream_support }}
      support_already_reported: ${{ steps.check.outputs.support_already_reported }}
      marker_revision: ${{ steps.check.outputs.marker_revision }}

    steps:
      - name: Checkout control branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Compare releases
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          control="$GITHUB_WORKSPACE/.github/scripts"

          scratch="$(mktemp -d "$RUNNER_TEMP/release-discovery.XXXXXXXX")"

          trap 'rm -rf -- "$scratch"' EXIT

          mkdir -m 700 "$scratch/home" "$scratch/repository"

          export HOME="$scratch/home"
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_TERMINAL_PROMPT=0

          unset GIT_CONFIG_COUNT GIT_CONFIG_PARAMETERS
          unset GIT_TEMPLATE_DIR GIT_EXEC_PATH
          unset GIT_ASKPASS SSH_ASKPASS

          cd "$scratch/repository"

          git init --bare --template=

          git remote add origin \
            https://github.com/T4T3Z0R/noctalia.git

          git remote add upstream \
            https://github.com/noctalia-dev/noctalia.git

          git -c fetch.fsckObjects=true fetch --no-tags origin \
            refs/heads/custom:refs/remotes/origin/custom

          custom_sha="$(
            git rev-parse --verify 'refs/remotes/origin/custom^{commit}'
          )"

          [[ "$custom_sha" =~ ^[0-9a-f]{40}$ ]]

          test -z "$(git for-each-ref --format='%(refname)' refs/tags)"

          git -c fetch.fsckObjects=true fetch --no-tags upstream \
            'refs/tags/*:refs/tags/*'

          latest_tag="$(
            gh api "repos/${UPSTREAM_REPO}/releases/latest" \
              --jq '.tag_name'
          )"

          [[ "$latest_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

          latest_sha="$(
            git rev-parse --verify "refs/tags/${latest_tag}^{commit}"
          )"

          [[ "$latest_sha" =~ ^[0-9a-f]{40}$ ]]

          # Discard non-release tags in this disposable
          # repository only. No remote refs are modified.
          tags="$(git for-each-ref --format='%(refname:strip=2)' refs/tags)"

          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue

            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              git update-ref -d "refs/tags/$tag"
            fi
          done <<< "$tags"

          current_tag="$(
            git describe --tags --abbrev=0 "$custom_sha"
          )"

          [[ "$current_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

          current_base_sha="$(
            git rev-parse --verify "refs/tags/${current_tag}^{commit}"
          )"

          [[ "$current_base_sha" =~ ^[0-9a-f]{40}$ ]]

          git merge-base --is-ancestor "$current_base_sha" "$custom_sha"

          # Reject backward or divergent upstream release selection.
          git merge-base --is-ancestor "$current_base_sha" "$latest_sha"

          python3 -I -B - "$current_tag" "$latest_tag" <<'PYVERSION'
          import re
          import sys

          def version(tag):
              match = re.fullmatch(
                  r"v([0-9]+)\.([0-9]+)\.([0-9]+)",
                  tag,
              )

              if match is None:
                  raise SystemExit("Invalid stable release version.")

              return tuple(map(int, match.groups()))

          current = version(sys.argv[1])
          latest = version(sys.argv[2])

          if latest < current:
              raise SystemExit("Upstream release version regressed.")
          PYVERSION

          # Reject ambiguous stable release names pointing
          # to either selected commit.
          for revision in "$current_base_sha" "$latest_sha"; do
            aliases="$(git tag --points-at "$revision")"

            count=0

            while IFS= read -r alias; do
              [[ -n "$alias" ]] || continue

              if [[ "$alias" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                count=$((count + 1))
              fi
            done <<< "$aliases"

            test "$count" = 1
          done

          changed=false
          upstream_support=false
          support_already_reported=false
          marker_revision=not-checked

          if [[ "$latest_sha" != "$current_base_sha" ]]; then
            changed=true

            grep_status=0

            git grep -El \
              'zwp_tablet_(manager|seat)_v2|tablet-unstable-v2' \
              "$latest_sha" \
              -- meson.build src/wayland lib/wayland \
              >/dev/null || grep_status=$?

            if (( grep_status > 1 )); then
              echo "Upstream tablet-support inspection failed." >&2
              exit "$grep_status"
            fi

            if (( grep_status == 0 )); then
              upstream_support=true

              marker_ref="refs/heads/${TABLET_MARKER_BRANCH}"

              marker_record="$(git ls-remote --refs origin "$marker_ref")"

              marker_revision=absent

              if [[ -n "$marker_record" ]]; then
                IFS=$'\t' read -r marker_sha observed_ref <<< "$marker_record"

                [[ "$marker_sha" =~ ^[0-9a-f]{40}$ ]]
                test "$observed_ref" = "$marker_ref"

                git fetch --no-tags origin "$marker_ref"

                actual_marker="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"

                test "$actual_marker" = "$marker_sha"

                marker_revision="$marker_sha"

                support_already_reported="$(
                  bash "$control/upstream-marker.sh" \
                    matches "$latest_sha" "$marker_sha"
                )"

                [[ "$support_already_reported" == true ||
                   "$support_already_reported" == false ]]
              fi
            fi
          fi

          {
            echo "changed=${changed}"
            echo "current_tag=${current_tag}"
            echo "current_base_sha=${current_base_sha}"
            echo "latest_tag=${latest_tag}"
            echo "latest_sha=${latest_sha}"
            echo "custom_sha=${custom_sha}"
            echo "upstream_support=${upstream_support}"
            echo "support_already_reported=${support_already_reported}"
            echo "marker_revision=${marker_revision}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo '## Noctalia custom updater'
            echo
            echo "- Current custom base: \`${current_tag}\`"
            echo "- Latest upstream: \`${latest_tag}\`"
            echo "- Update needed: \`${changed}\`"
            echo "- Upstream tablet-v2 detected: \`${upstream_support}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  upstream-support:
    name: Upstream patch review needed
    needs: check

    if: >-
      github.repository == 'T4T3Z0R/noctalia' &&
      github.ref == 'refs/heads/main' &&
      needs.check.outputs.changed == 'true' &&
      needs.check.outputs.upstream_support == 'true' &&
      needs.check.outputs.support_already_reported != 'true'

    environment: noctalia-candidate

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout trusted control revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve detected upstream release
        id: marker
        env:
          LATEST_TAG: ${{ needs.check.outputs.latest_tag }}
          EXPECTED_SHA: ${{ needs.check.outputs.latest_sha }}
          OBSERVED_MARKER: ${{ needs.check.outputs.marker_revision }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          [[ "$LATEST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]

          git check-ref-format "refs/tags/$LATEST_TAG"

          git fetch --no-tags \
            "https://github.com/${UPSTREAM_REPO}.git" \
            "refs/tags/${LATEST_TAG}"

          latest_sha="$(git rev-parse --verify "FETCH_HEAD^{commit}")"

          test "$latest_sha" = "$EXPECTED_SHA"

          marker_ref="refs/heads/automation/upstream-tablet-detected"

          case "$OBSERVED_MARKER" in
            absent)
              previous=""
              ;;
            *)
              [[ "$OBSERVED_MARKER" =~ ^[0-9a-f]{40}$ ]]
              previous="$OBSERVED_MARKER"
              ;;
          esac

          marker_record="$(git ls-remote --refs origin "$marker_ref")"

          expected_record=""

          if [[ -n "$previous" ]]; then
            expected_record="${previous}"$'\t'"${marker_ref}"
          fi

          if [[ "$marker_record" != "$expected_record" ]]; then
            echo "Marker changed after release discovery." >&2
            exit 1
          fi

          marker_sha="$(
            bash .github/scripts/upstream-marker.sh \
              create "$latest_sha"
          )"

          [[ "$marker_sha" =~ ^[0-9a-f]{40}$ ]]

          test "$(bash .github/scripts/upstream-marker.sh \
            matches "$latest_sha" "$marker_sha")" = true

          {
            printf 'sha=%s\n' "$marker_sha"
            printf 'previous=%s\n' "$previous"
          } >> "$GITHUB_OUTPUT"

      - name: Create restricted marker installation token
        id: marker-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ vars.NOCTALIA_CANDIDATE_APP_ID }}
          private-key: ${{ secrets.NOCTALIA_CANDIDATE_APP_PRIVATE_KEY }}
          owner: T4T3Z0R
          repositories: noctalia
          permission-contents: write
          skip-token-revoke: false

      - name: Record exact upstream marker
        env:
          CUSTOM_GIT_TOKEN: ${{ steps.marker-token.outputs.token }}
          CUSTOM_GIT_ROLE: marker
          MARKER_SHA: ${{ steps.marker.outputs.sha }}
          EXPECTED_PREVIOUS: ${{ steps.marker.outputs.previous }}
          EXPECTED_SHA: ${{ needs.check.outputs.latest_sha }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          source "$GITHUB_WORKSPACE/.github/scripts/authenticated-git.sh"

          [[ "$MARKER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]

          if [[ -n "$EXPECTED_PREVIOUS" ]]; then
            [[ "$EXPECTED_PREVIOUS" =~ ^[0-9a-f]{40}$ ]]
          fi

          test "$MARKER_SHA" != "$EXPECTED_SHA"

          test "$(bash .github/scripts/upstream-marker.sh \
            matches "$EXPECTED_SHA" "$MARKER_SHA")" = true

          ref="refs/heads/automation/upstream-tablet-detected"

          authenticated_git push origin \
            "$MARKER_SHA:$ref" \
            "--force-with-lease=$ref:$EXPECTED_PREVIOUS"

      - name: Stop for manual review
        env:
          LATEST_TAG: ${{ needs.check.outputs.latest_tag }}
        run: |
          set -euo pipefail

          [[ "$LATEST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

          printf '::error::Upstream %s appears to contain tablet-v2 support. The custom pen patch may no longer be needed.\n' \
            "$LATEST_TAG"

          exit 1

  rebase-candidate:
    name: Prepare credential-free candidate
    needs: check

    if: >-
      github.repository == 'T4T3Z0R/noctalia' &&
      github.ref == 'refs/heads/main' &&
      needs.check.outputs.changed == 'true' &&
      needs.check.outputs.upstream_support != 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    outputs:
      candidate_sha: ${{ steps.rebase.outputs.candidate_sha }}
      bundle_sha256: ${{ steps.rebase.outputs.bundle_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Checkout trusted control revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare exact candidate and export bundle
        id: rebase
        env:
          CUSTOM_SHA: ${{ needs.check.outputs.custom_sha }}
          CURRENT_BASE_SHA: ${{ needs.check.outputs.current_base_sha }}
          LATEST_SHA: ${{ needs.check.outputs.latest_sha }}
          LATEST_TAG: ${{ needs.check.outputs.latest_tag }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          for revision in "$CUSTOM_SHA" "$CURRENT_BASE_SHA" "$LATEST_SHA"
          do
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          done

          [[ "$LATEST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

          control="$GITHUB_WORKSPACE/.github/scripts"

          scratch="$(mktemp -d "$RUNNER_TEMP/candidate-preparation.XXXXXXXX")"

          trap 'rm -rf -- "$scratch"' EXIT

          mkdir -m 700 "$scratch/home" "$scratch/repository"

          export HOME="$scratch/home"
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_TERMINAL_PROMPT=0

          unset GIT_CONFIG_COUNT GIT_CONFIG_PARAMETERS
          unset GIT_TEMPLATE_DIR GIT_EXEC_PATH
          unset GIT_ASKPASS SSH_ASKPASS

          cd "$scratch/repository"

          git init --template= --initial-branch=workspace

          git -c fetch.fsckObjects=true fetch --no-tags \
            https://github.com/T4T3Z0R/noctalia.git \
            refs/heads/custom

          test "$(git rev-parse --verify "FETCH_HEAD^{commit}")" = "$CUSTOM_SHA"

          git -c fetch.fsckObjects=true fetch --no-tags \
            https://github.com/noctalia-dev/noctalia.git \
            "refs/tags/$LATEST_TAG"

          test "$(git rev-parse --verify "FETCH_HEAD^{commit}")" = "$LATEST_SHA"

          test "$(git cat-file -t "$CURRENT_BASE_SHA")" = commit

          candidate_sha="$(
            bash "$control/prepare-candidate.sh" \
              "$CUSTOM_SHA" "$CURRENT_BASE_SHA" "$LATEST_SHA"
          )"

          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]

          artifact_dir="$RUNNER_TEMP/candidate-transfer"

          mkdir -m 700 "$artifact_dir"

          bundle_sha256="$(
            bash "$control/candidate-bundle.sh" export \
              "$artifact_dir/candidate.bundle" \
              "$candidate_sha" "$LATEST_SHA" -
          )"

          [[ "$bundle_sha256" =~ ^[0-9a-f]{64}$ ]]

          {
            printf 'candidate_sha=%s\n' "$candidate_sha"
            printf 'bundle_sha256=%s\n' "$bundle_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Upload exact candidate bundle
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noctalia-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-transfer/candidate.bundle
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  validate:
    name: Validate exact candidate source
    needs:
      - check
      - rebase-candidate

    if: ${{ github.repository == 'T4T3Z0R/noctalia' && github.ref == 'refs/heads/main' }}

    permissions:
      contents: read

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout trusted control revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require exact artifact identity
        env:
          ARTIFACT_ID: ${{ needs.rebase-candidate.outputs.artifact_id }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]

      - name: Download exact candidate bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.rebase-candidate.outputs.artifact_id }}
          path: ${{ runner.temp }}/candidate-transfer
          merge-multiple: true

      - name: Reconstruct exact candidate
        env:
          CANDIDATE_SHA: ${{ needs.rebase-candidate.outputs.candidate_sha }}
          BUNDLE_SHA256: ${{ needs.rebase-candidate.outputs.bundle_sha256 }}
          LATEST_SHA: ${{ needs.check.outputs.latest_sha }}
          LATEST_TAG: ${{ needs.check.outputs.latest_tag }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          artifact_dir="$RUNNER_TEMP/candidate-transfer"
          entries="$(find "$artifact_dir" -mindepth 1 -printf '%P\n')"

          test "$entries" = candidate.bundle

          destination="$RUNNER_TEMP/validation-receiver"

          actual="$(
            bash .github/scripts/receive-candidate.sh \
              "$destination" \
              "$artifact_dir/candidate.bundle" \
              "$CANDIDATE_SHA" \
              "$LATEST_SHA" \
              "$LATEST_TAG" \
              "$BUNDLE_SHA256"
          )"

          test "$actual" = "$CANDIDATE_SHA"

          {
            echo '## Candidate validation'
            echo "- Candidate: $CANDIDATE_SHA"
            echo "- Upstream: $LATEST_SHA"
            echo "- Bundle SHA256: $BUNDLE_SHA256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Execute isolated candidate validation
        env:
          CANDIDATE_SHA: ${{ needs.rebase-candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          bash .github/scripts/validate-candidate.sh \
            "$RUNNER_TEMP/validation-receiver/repository" \
            "$CANDIDATE_SHA"

  promote:
    name: Promote validated candidate
    needs:
      - check
      - rebase-candidate
      - validate

    if: ${{ github.repository == 'T4T3Z0R/noctalia' && github.ref == 'refs/heads/main' }}

    permissions:
      contents: read

    environment: noctalia-source-promotion

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout trusted control revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require exact artifact identity
        env:
          ARTIFACT_ID: ${{ needs.rebase-candidate.outputs.artifact_id }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]

      - name: Download original candidate bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.rebase-candidate.outputs.artifact_id }}
          path: ${{ runner.temp }}/candidate-transfer
          merge-multiple: true

      - name: Independently reconstruct validated candidate
        env:
          CANDIDATE_SHA: ${{ needs.rebase-candidate.outputs.candidate_sha }}
          BUNDLE_SHA256: ${{ needs.rebase-candidate.outputs.bundle_sha256 }}
          LATEST_SHA: ${{ needs.check.outputs.latest_sha }}
          LATEST_TAG: ${{ needs.check.outputs.latest_tag }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          artifact_dir="$RUNNER_TEMP/candidate-transfer"
          entries="$(find "$artifact_dir" -mindepth 1 -printf '%P\n')"

          test "$entries" = candidate.bundle

          destination="$RUNNER_TEMP/promotion-receiver"

          actual="$(
            bash .github/scripts/receive-candidate.sh \
              "$destination" \
              "$artifact_dir/candidate.bundle" \
              "$CANDIDATE_SHA" \
              "$LATEST_SHA" \
              "$LATEST_TAG" \
              "$BUNDLE_SHA256"
          )"

          test "$actual" = "$CANDIDATE_SHA"

      - name: Update custom branch
        env:
          CUSTOM_GIT_TOKEN: ${{ secrets.CUSTOM_BRANCH_TOKEN }}
          CUSTOM_GIT_ROLE: promotion
          EXPECTED_CUSTOM_SHA: ${{ needs.check.outputs.custom_sha }}
          CANDIDATE_SHA: ${{ needs.rebase-candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          source "$GITHUB_WORKSPACE/.github/scripts/authenticated-git.sh"

          [[ "$EXPECTED_CUSTOM_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]

          destination="$RUNNER_TEMP/promotion-receiver"

          export HOME="$destination/home"
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL=/dev/null

          cd "$destination/repository"

          test "$(git rev-parse --is-bare-repository)" = true

          actual="$(git rev-parse --verify 'refs/heads/remediation-transfer^{commit}')"

          test "$actual" = "$CANDIDATE_SHA"

          git remote add origin \
            https://github.com/T4T3Z0R/noctalia.git

          production_ref="refs/heads/custom"
          archive_ref="refs/heads/archive/custom-$EXPECTED_CUSTOM_SHA"

          # Independently fetch the production source that
          # this workflow was authorized to displace.
          git -c fetch.fsckObjects=true fetch --no-tags origin \
            "$production_ref"

          displaced="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"

          if [[ "$displaced" != "$EXPECTED_CUSTOM_SHA" ]]; then
            echo "Production changed after candidate discovery." >&2
            exit 1
          fi

          # Do not interpret a remote lookup failure
          # as an absent archive.
          archive_record="$(git ls-remote --refs origin "$archive_ref")"

          expected_archive="${EXPECTED_CUSTOM_SHA}"$'\t'"${archive_ref}"

          if [[ -z "$archive_record" ]]; then
            CUSTOM_GIT_ROLE=retention authenticated_git push origin \
              "$EXPECTED_CUSTOM_SHA:$archive_ref" \
              "--force-with-lease=$archive_ref:"
          elif [[ "$archive_record" != "$expected_archive" ]]; then
            echo "Existing rollback archive has incorrect identity." >&2
            exit 1
          fi

          # Both newly created and existing archives
          # require independent remote verification.
          archive_record="$(git ls-remote --refs origin "$archive_ref")"

          test "$archive_record" = "$expected_archive"

          {
            echo "## Production source retention"
            echo "- Displaced revision: $EXPECTED_CUSTOM_SHA"
            echo "- Verified rollback ref: $archive_ref"
            echo "- Candidate revision: $CANDIDATE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

          # Retention must succeed before production mutation.
          authenticated_git push origin \
            "$CANDIDATE_SHA:refs/heads/custom" \
            "--force-with-lease=refs/heads/custom:$EXPECTED_CUSTOM_SHA"

          # Verify the resulting remote state rather than
          # relying exclusively on the push exit status.
          production_record="$(git ls-remote --refs origin "$production_ref")"

          expected_production="${CANDIDATE_SHA}"$'\t'"${production_ref}"

          test "$production_record" = "$expected_production"

          archive_record="$(git ls-remote --refs origin "$archive_ref")"

          test "$archive_record" = "$expected_archive"

          {
            echo "## Production promotion completed"
            echo "- Promoted candidate: $CANDIDATE_SHA"
            echo "- Verified production ref: $production_ref"
            echo "- Verified rollback ref: $archive_ref"
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    permissions: {}
    name: Notify via Pushover
    needs:
      - check
      - upstream-support
      - rebase-candidate
      - validate
      - promote

    if: >-
      always() &&
      github.repository == 'T4T3Z0R/noctalia' && github.ref == 'refs/heads/main' && (
          (github.event_name == 'workflow_dispatch' && inputs.test_pushover == true) ||
          needs.check.result == 'failure' ||
          (
            needs.check.result == 'success' &&
            needs.check.outputs.changed == 'true' &&
            needs.check.outputs.upstream_support == 'true' &&
            needs.check.outputs.support_already_reported != 'true'
          ) ||
          needs.rebase-candidate.result == 'failure' ||
          needs.validate.result == 'failure' ||
          needs.promote.result == 'failure'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Send Pushover notification
        env:
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          TEST_PUSHOVER: ${{ inputs.test_pushover }}
          CHECK_RESULT: ${{ needs.check.result }}
          CURRENT_TAG: ${{ needs.check.outputs.current_tag }}
          LATEST_TAG: ${{ needs.check.outputs.latest_tag }}
          UPSTREAM_SUPPORT: ${{ needs.check.outputs.upstream_support }}
          REBASE_RESULT: ${{ needs.rebase-candidate.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PROMOTE_RESULT: ${{ needs.promote.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [[ -z "${PUSHOVER_APP_TOKEN}" || -z "${PUSHOVER_USER_KEY}" ]]; then
            echo "::error::Pushover secrets are missing."
            exit 1
          fi

          title="Noctalia custom"
          message="The updater completed with an unexpected state."

          if [[ "${TEST_PUSHOVER}" == "true" ]]; then
            title="Noctalia updater test"
            message="Pushover notifications from GitHub Actions are working."
          elif [[ "${CHECK_RESULT}" != "success" ]]; then
            title="Noctalia update check FAILED"
            message="The upstream release check failed before an update decision could be made."
          elif [[ "${UPSTREAM_SUPPORT}" == "true" ]]; then
            title="Noctalia upstream tablet support"
            message="Upstream ${LATEST_TAG} appears to contain tablet-v2 support. The custom pen patch was left unchanged and needs manual review."
          elif [[ "${REBASE_RESULT}" == "failure" ]]; then
            title="Noctalia custom update FAILED"
            message="Rebase onto ${LATEST_TAG} failed. The existing custom branch remains unchanged."
          elif [[ "${VALIDATE_RESULT}" == "failure" ]]; then
            title="Noctalia custom update FAILED"
            message="Source validation (formatting, build, tests, or lint) for ${LATEST_TAG} failed. The existing custom branch remains unchanged."
          elif [[ "${PROMOTE_RESULT}" == "failure" ]]; then
            title="Noctalia custom update FAILED"
            message="Validation passed for ${LATEST_TAG}, but promotion of custom failed. Manual review is required."
          fi

          curl --fail --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --max-time 30 \
            --form-string "token=${PUSHOVER_APP_TOKEN}" \
            --form-string "user=${PUSHOVER_USER_KEY}" \
            --form-string "title=${title}" \
            --form-string "message=${message}" \
            --form-string "url=${RUN_URL}" \
            --form-string "url_title=Open GitHub Actions run" \
            https://api.pushover.net/1/messages.json
