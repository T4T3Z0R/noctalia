name: Lint control workflows

on:
  push:
    branches:
      - main
      - 'fix/**'
      - feature/remediation-w01-control
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.github/tests/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.github/tests/**'

permissions:
  contents: read

jobs:
  lint:
    name: Validate control workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10

    container:
      image: archlinux:latest

    steps:
      - name: Install workflow validation tools
        id: install
        run: |
          pacman -Syu --noconfirm --needed \
            git actionlint shellcheck python python-yaml

      - name: Checkout workflow definitions
        id: checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate control workflows
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail

          actionlint -version
          shellcheck --version

          actionlint -color \
            .github/workflows/update-custom.yml \
            .github/workflows/lint-control-workflows.yml \
            .github/workflows/ci.yml

      - name: Validate automation helpers
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail

          for helper in .github/scripts/*.sh
          do
            bash -n "$helper"
          done

          shellcheck -x -P .github/scripts .github/scripts/*.sh

      - name: Run automation regression tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail

          for test_file in .github/tests/test_*.py
          do
            printf '\n=== %s ===\n' "$test_file"
            python3 -I -B "$test_file"
          done
